[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-excel-formula-verifier"
authors = [{ name = "Sanjay Mouraly", email = "sanjaymouraly@users.noreply.github.com" }]
version = "0.1.1"
description = "Counterexample-driven validation of AI-generated Excel formulas"
requires-python = ">=3.11"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "streamlit>=1.42,<2",
 "openpyxl>=3.1,<4", "pydantic>=2.10,<3",
 "sqlalchemy>=2.0,<3", "pandas>=2.2,<4", "numpy>=2,<3", "plotly>=6,<7",
 "httpx>=0.28,<1", "python-dotenv>=1,<2", "python-multipart>=0.0.20,<1", "typer>=0.15,<1"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "playwright>=1.50,<2"]
[project.scripts]
excel-verify = "app.cli.main:app"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real LibreOffice calculation", "e2e: running browser integration"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[project.urls]
Homepage = "https://github.com/sanjaymouraly/ai-excel-formula-validator"
Repository = "https://github.com/sanjaymouraly/ai-excel-formula-validator"
Issues = "https://github.com/sanjaymouraly/ai-excel-formula-validator/issues"

